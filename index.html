<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  }

body {
min-height: 100vh;
font-family: Arial, Helvetica, sans-serif;
background: linear-gradient(135deg, #050816, #101a35, #180b2e);
color: #ffffff;
display: flex;
flex-direction: column;
overflow-x: hidden;
}

/* Header */

header {
width: 100%;
padding: 15px 0;
background: rgba(5, 10, 25, 0.95);
border-bottom: 2px solid #00e5ff;
box-shadow: 0 0 20px rgba(0, 229, 255, 0.25);
}

header h2 {
font-size: 22px;
color: #00e5ff;
letter-spacing: 1px;
text-shadow: 0 0 12px rgba(0, 229, 255, 0.7);
}

/* Main Section */

main {
width: 90%;
max-width: 500px;
margin: 65px auto;
padding: 35px 30px;
background: rgba(15, 23, 48, 0.88);
border: 1px solid rgba(0, 229, 255, 0.5);
border-radius: 20px;
box-shadow: 0 0 30px rgba(0, 229, 255, 0.12),
0 0 60px rgba(145, 0, 255, 0.1);
animation: appear 0.8s ease;
}

main h3 {
font-size: 22px;
line-height: 1.6;
text-align: center;
margin-bottom: 35px;
color: #f2f5ff;
}

main h3 u {
color: #00e5ff;
text-decoration-color: #a855f7;
}

/* Form */

form {
width: 100%;
}

form div {
margin-bottom: 18px;
}

label {
font-size: 15px;
color: #dce6ff;
cursor: pointer;
}

input[type="text"] {
display: block;
width: 100%;
margin-top: 10px;
padding: 14px;
background: #080f23;
color: #ffffff;
border: 1px solid #344568;
border-radius: 10px;
font-size: 16px;
outline: none;
transition: 0.3s;
}

input[type="text"]:focus {
border-color: #00e5ff;
box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
}

input::placeholder {
color: #8290ad;
}

/* Visitor Options */

form b {
display: block;
margin: 25px 0 18px;
color: #facc15;
font-size: 15px;
line-height: 1.5;
}

input[type="radio"] {
width: 17px;
height: 17px;
margin: 12px 7px 12px 3px;
accent-color: #00e5ff;
vertical-align: middle;
cursor: pointer;
}

/* Submit Button */

button[type="submit"] {
display: block;
width: 100%;
margin-top: 25px;
padding: 15px;
border: none;
border-radius: 10px;
background: linear-gradient(90deg, #00c6ff, #7c3aed);
color: #ffffff;
font-size: 18px;
font-weight: bold;
letter-spacing: 1px;
cursor: pointer;
box-shadow: 0 0 18px rgba(0, 198, 255, 0.25);
transition: 0.3s ease;
}

button[type="submit"]:hover {
transform: translateY(-3px);
background: linear-gradient(90deg, #7c3aed, #00c6ff);
box-shadow: 0 0 25px rgba(0, 229, 255, 0.55);
}

button[type="submit"]:active {
transform: scale(0.97);
}

/* Divider */

hr {
width: 85%;
margin: 0 auto;
border: none;
height: 1px;
background: linear-gradient(90deg, transparent, #00e5ff, #a855f7, transparent);
}

/* Footer */

footer {
margin-top: auto;
padding: 25px 15px;
text-align: center;
color: #9eaccb;
font-size: 14px;
}

/* Animation */

@keyframes appear {
from {
opacity: 0;
transform: translateY(20px);
}

to {
opacity: 1;
transform: translateY(0);
}
}

/* Mobile Responsive */

@media (max-width: 480px) {
header h2 {
font-size: 17px;
}

main {
width: 92%;
margin: 40px auto;
padding: 25px 20px;
}

main h3 {
font-size: 19px;
}

label,
form b {
font-size: 14px;
}

button[type="submit"] {
font-size: 16px;
}
}
  </style>
<body>
  <header>
    <marquee>
      <h2>🎮 Welcome to BHATI GAMING WORLD | 🔥 Explore Top Games | 🏆 Latest Gaming News | 🚀 Discover New Adventures</h2>
    </marquee>
  </header>
  <main>
    <h3>
      For visiting the offical website of <u>BHATI GAMING WORLD</u> please fill this formelty first
    </h3>
    <form action="Home/Homefile.html">
      <div>
        <label for="Name">Name</label>
        <input id="Name" type="text" placeholder="Enter your name" required>
      </div>
      <br>
      <b>You visit website(First time or Earlier):</b>
      <div>
        <label for="First time">First time Visitor</label>
        <input id="First time" name="time"type="radio"required>
        <label for="return">Returning Visitor</label>
        <input id="return" name="time"type="radio"required>
      </div><br>
      <button type="submit">Submit</button>
    </form>
  </main>
  <hr>
  
  <footer>
    <p>© 2026 BHATI GAMING WORLD. All Rights Reserved.</p>
  </footer>
</body>
</html>
